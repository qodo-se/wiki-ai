services:
  api:
    build: ./backend
    hostname: wiki
    volumes:
      - ./static:/app/static:ro
      - wiki-data:/data
    environment:
      - HOST=0.0.0.0
    # Lets the api container reach Ollama running on the host machine at
    # http://host.docker.internal:11434 (the default in the settings UI).
    # Docker Desktop (Mac/Windows) wires this up automatically; on Linux this
    # extra_hosts entry is what makes host.docker.internal resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8081}:80"
    depends_on:
      - qdrant

  mcp:
    build: ./mcp
    environment:
      # "wiki" is the api service's own hostname, set above for exactly this
      # kind of in-network access (the same hostname Ollama is documented to
      # reach it by).
      - WIKI_URL=http://wiki:80
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8082
    ports:
      # Host-side default deliberately differs from the container's own 8082
      # (set above): scripts/staging.sh defaults to publishing its staging api
      # on host port 8082 too, so defaulting both to 8082 would collide the
      # moment both are run at once.
      - "${MCP_PORT:-8090}:8082"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  wiki-data:
  qdrant-data:
